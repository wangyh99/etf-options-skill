<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ETF 期权策略控制台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">A股 ETF OPTIONS</p>
        <h1>双策略交易控制台</h1>
        <p>510050 · 510300 · 两个 DTE 15–60 到期日</p>
      </div>
    </header>

    <nav class="tabs" aria-label="策略选择">
      <button class="tab active" data-strategy="iron_condor">铁鹰策略</button>
      <button class="tab" data-strategy="short_strangle">宽跨策略</button>
    </nav>

    <section class="panel controls">
      <div class="section-title">
        <h2>策略参数</h2>
        <p>参数同时用于两个 ETF 和两个目标到期日</p>
      </div>
      <form id="params-form">
        <label>风险箱体覆盖率
          <div class="range-line">
            <input id="quantile" type="range" min="80" max="99" step="1">
            <output id="quantile-value"></output>
          </div>
        </label>
        <label>短周期指标
          <select id="timeframe">
            <option value="weekly">周线</option>
            <option value="daily">日线</option>
          </select>
        </label>
        <label>箱体模型
          <select id="box-model">
            <option value="asymmetric">非对称（长期位置+状态）</option>
            <option value="baseline">基线（历史分位+波动率）</option>
          </select>
          <small>位置特征固定使用约10年前复权日线</small>
        </label>
        <label>交易带上下扩大
          <select id="range-pad">
            <option value="0.00">0%</option>
            <option value="0.01">1%</option>
            <option value="0.02">2%</option>
            <option value="0.03">3%</option>
            <option value="0.04">4%</option>
            <option value="0.05">5%</option>
          </select>
        </label>
        <fieldset>
          <legend>目标到期日 DTE</legend>
          <div class="pair">
            <label>最小<input id="dte-min" type="number" min="15" max="59"></label>
            <label>最大<input id="dte-max" type="number" min="16" max="60"></label>
          </div>
          <small>区间内按 DTE 升序选前两个到期日</small>
        </fieldset>
        <fieldset>
          <legend>预期月均收益率</legend>
          <label>不低于
            <div class="range-line">
              <input id="yield-min" type="number" min="1" max="3" step="0.1">
              <span class="unit">%</span>
            </div>
          </label>
          <small>持有到期收益率 × 30 / DTE；在达标结构中选卖出档最接近扫描带两端的组合</small>
        </fieldset>
      </form>
      <div class="actions">
        <button id="forecast-button" class="secondary">预测交易带</button>
        <button id="advice-button" class="primary">当前交易策略</button>
        <button id="save-button" class="ghost">保存当前参数</button>
        <span id="status" role="status" aria-live="polite">正在加载参数</span>
      </div>
    </section>

    <section class="output-section">
      <div class="section-title">
        <h2>交易带与策略</h2>
        <p id="workspace-hint">每个到期日先显示预测带；点“当前交易策略”后在同一到期日下方给出建议</p>
      </div>
      <div id="workspace-output" class="placeholder">点击“预测交易带”或“当前交易策略”开始计算</div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
